<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>海大電機學程島</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@800;900&family=Newsreader:ital,wght@1,500&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* VOICE: 親切的校園導覽口吻，但課程資訊完全依系上文件
   IDEA: 學程是一片群島：學年是島、課程是房子、銜接是橋與航線、系主任在系館島導覽
   PICTURE: 全幅可拖曳縮放的 SVG 海圖，四個學生小人在各自的學年島上走動
   COLOUR and TYPE: 參考 HEART 政策島：暖白底、陶土橘 #DB6A41、海藍、草綠；Noto Sans TC + Archivo 標誌字
   LAYOUT: 左地圖、右索引欄、左浮動詳情卡；窄螢幕改為上下堆疊 */
:root{--o:#DB6A41;--o2:#fbe9df;--ink:#231f1c;--mut:#756a62;--line:#eee4dc;--paper:#fffaf6;--card:#fffdfb;color-scheme:light}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;font:15px/1.6 "Noto Sans TC",system-ui,sans-serif;color:var(--ink);background:var(--paper);display:grid;grid-template-columns:minmax(0,1fr) 390px;height:100vh;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--o);outline-offset:2px}
#stage{position:relative;overflow:hidden;background:#79bfcf}
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;user-select:none}
#map.drag{cursor:grabbing}
.glass{background:rgba(255,252,249,.92);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.8);box-shadow:0 6px 24px rgba(60,40,20,.14);border-radius:22px}
.brand{position:absolute;top:14px;left:14px;display:flex;align-items:center;gap:14px;padding:10px 18px 10px 16px}
.brand b{font:900 34px/0.92 Archivo,sans-serif;color:var(--o);letter-spacing:.5px}
.brand span{display:block;font-weight:900;font-size:19px;line-height:1.25}
.brand small{display:block;font-weight:700;font-size:13px;color:var(--o)}
.brand small em{font-style:normal;color:var(--ink)}
.top{position:absolute;top:14px;right:14px;display:flex;gap:8px}
.top button,.tool button{border:0;background:rgba(255,252,249,.94);box-shadow:0 3px 12px rgba(60,40,20,.13);border-radius:14px;min-height:42px;padding:0 14px;font-size:14px;font-weight:500;display:flex;align-items:center;gap:6px}
.top button[aria-pressed=true]{background:var(--ink);color:#fff}
.tool{position:absolute;top:96px;left:14px;display:flex;gap:8px;flex-wrap:wrap;max-width:calc(100% - 28px)}
.seg{display:flex;gap:2px;padding:5px;border-radius:999px}
.seg button{box-shadow:none;background:none;border-radius:999px;min-height:44px;min-width:44px;padding:0 8px;flex-direction:column;justify-content:center;gap:0;font-size:11px;color:var(--mut)}
.seg button svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
.seg.time button{padding:0 10px}
#card{position:absolute;left:14px;top:162px;bottom:14px;width:330px;overflow:auto;padding:22px 20px 20px;display:none;overscroll-behavior:contain}
#card.show{display:block;animation:pop .25s ease}
@keyframes pop{from{opacity:0;transform:translateY(8px)}}
.x{position:absolute;right:12px;top:12px;width:40px;height:40px;border:0;background:none;font-size:22px;color:var(--mut);border-radius:12px}
.x:hover{background:var(--o2)}
.eb{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--o)}
.hd{display:flex;gap:12px;align-items:center;margin:4px 34px 10px 0}
.ic{flex:none;width:46px;height:46px;border-radius:14px;background:var(--o2);display:grid;place-items:center}
.ic svg{width:30px;height:30px}
h2{margin:0;font-size:22px;line-height:1.25;font-weight:900}
.desc{margin:0 0 12px;font-size:14.5px;color:#4a413b}
.quote{border-left:3px solid var(--o);padding:2px 0 2px 12px;margin:0 0 12px;font-size:14px;color:#5b514a}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.tag{border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 11px;font-size:12.5px;font-weight:500}
.tag.o{background:var(--o2);border-color:#f4cdb9;color:#a7461f}
button.tag{min-height:32px}
.sh{font-size:12px;font-weight:700;color:var(--mut);margin:14px 0 6px}
.li{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:14px;padding:9px 12px;margin-bottom:6px;min-height:44px;font-size:14.5px}
button.li:hover{border-color:#f0b99f;background:#fff7f2}
.li i{font:italic 500 17px/1 Newsreader,serif;color:var(--o);width:22px;flex:none}
.li .d{width:8px;height:8px;border-radius:50%;flex:none}
.li .ty{margin-left:auto;font-size:11.5px;color:var(--mut);white-space:nowrap}
.li .ar{color:#bbb;flex:none}
.note{background:#fff5e9;border:1px solid #f6dcbc;border-radius:14px;padding:10px 12px;font-size:13.5px;color:#6b4a2c;margin:10px 0}
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:6px}
.chain .ar2{color:var(--o);font-weight:700}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line)}
td.n{text-align:right;white-space:nowrap}
code{font-size:12.5px;background:#f6efe9;padding:1px 6px;border-radius:6px}
#tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;font-size:13px;padding:5px 10px;border-radius:10px;white-space:nowrap;display:none;z-index:9}
/* tour */
#tour{position:absolute;inset:0;display:none;place-items:center;z-index:8;padding:16px}
#tour.show{display:grid}
#tour.blur{backdrop-filter:blur(5px);background:rgba(240,230,220,.25)}
#tour.dock{place-items:end center;pointer-events:none}
#tour .box{pointer-events:auto;width:min(440px,100%);padding:24px 24px 20px;border-radius:24px;background:#fff8f4;box-shadow:0 14px 50px rgba(60,40,20,.25);display:grid;grid-template-columns:64px 1fr;gap:4px 16px}
#tour .av{grid-row:span 3;width:64px;height:84px}
#tour h3{margin:2px 0 6px;font-size:22px;line-height:1.3}
#tour p{margin:0 0 16px;font-size:14.5px;color:#4f4640}
#tour .bt{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center}
.btn{min-height:44px;border-radius:14px;padding:0 16px;border:1px solid var(--line);background:#fff;font-weight:500}
.btn.k{background:var(--ink);color:#fff;border-color:var(--ink)}
.dots{display:flex;gap:5px}.dots i{width:6px;height:6px;border-radius:50%;background:#e3d3c8}.dots i.on{background:var(--o);width:16px;border-radius:4px}
/* list overlay */
#list{position:absolute;inset:0;z-index:7;display:none;background:rgba(40,30,20,.25);padding:clamp(10px,3vw,40px);overflow:auto}
#list.show{display:block}
#list .panel{position:relative;max-width:980px;margin:0 auto;background:var(--card);border-radius:24px;padding:24px clamp(14px,3vw,28px)}
#list h2{margin-bottom:4px}
.grid{display:grid;grid-template-columns:70px minmax(0,1fr) minmax(0,1fr);border-top:1px solid var(--line);margin-top:14px}
.grid>div{padding:12px 8px;border-bottom:1px solid var(--line)}
.grid .yr{font:italic 500 22px/1.2 Newsreader,serif;color:var(--o)}
.grid .hdr{font-size:12px;font-weight:700;color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);border-radius:10px;background:#fff;padding:5px 10px;font-size:13.5px;min-height:34px;display:inline-flex;align-items:center;gap:6px}
.chip:hover{border-color:#f0b99f}
.chip .d,.leg .d{width:8px;height:8px;border-radius:2px}
.leg{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--mut);margin-top:6px}
.leg span{display:inline-flex;align-items:center;gap:6px}
/* sidebar */
aside{overflow:auto;border-left:1px solid var(--line);background:linear-gradient(#fff6f0,#fffaf6 260px);padding:22px 22px 30px}
aside h1{font-size:30px;line-height:1.15;margin:4px 0 6px;font-weight:900}
.sub{font-size:13px;color:var(--mut);margin:0 0 16px}
.who{border:1px solid #f4cdb9;background:#fff3ec;border-radius:18px;padding:12px 14px;margin-bottom:14px}
.who b{display:block;font-size:15.5px}
.who p{margin:2px 0 10px;font-size:13px;color:var(--mut)}
.who .row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.who button{min-height:40px;border-radius:12px;border:1px solid #f0c4ad;background:#fff;font-weight:700;font-size:14px}
.who button:hover{background:var(--o);color:#fff;border-color:var(--o)}
.search{width:100%;min-height:48px;border:1px solid var(--line);border-radius:16px;padding:0 16px;font:16px "Noto Sans TC",sans-serif;background:#fff;margin-bottom:12px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.tabs button{min-height:46px;border-radius:14px;border:1px solid var(--line);background:#fff;font-weight:500}
.tabs button[aria-selected=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.idx{display:flex;align-items:center;gap:12px;width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:12px 8px;text-align:left;min-height:52px;font-size:15px;font-weight:500;border-radius:0}
.idx:hover,.idx.on{background:#fff0e7}
.idx.on{box-shadow:inset 3px 0 var(--o)}
.idx i{font:italic 500 24px/1 Newsreader,serif;color:var(--o);width:34px;flex:none}
.idx small{margin-left:auto;color:var(--mut);font-size:12px;white-space:nowrap}
.idx .s2{display:block;font-size:12px;color:var(--mut);font-weight:400}
.foot{font-size:12px;color:var(--mut);margin-top:18px;line-height:1.6}
/* svg */
.lab rect{fill:#fff;stroke:rgba(0,0,0,.06)}
.lab text{font:700 17px "Noto Sans TC",sans-serif;fill:#231f1c}
.lab tspan.n{fill:#DB6A41;font-family:Newsreader,serif;font-style:italic;font-weight:500}
#map.nolab .lab{display:none}
.semlab{display:none}
#map.near .semlab{display:inline}
.semlab text{font:700 11px "Noto Sans TC",sans-serif;fill:#5b4a3c}
.isl{cursor:pointer}
.isl .top{transition:filter .2s}
.isl:hover .top{filter:brightness(1.05)}
.isl.sel .rim{stroke:#DB6A41;stroke-width:4}
.pin{cursor:pointer}
.pin text{font:700 9px "Noto Sans TC",sans-serif;fill:#DB6A41}
.pin .ring{fill:none;stroke:#DB6A41;stroke-width:2;opacity:0}
.pin.on .ring{animation:ring 1.4s infinite}
.pin.on circle.b{fill:#DB6A41}.pin.on text{fill:#fff}
@keyframes ring{0%{opacity:.9;r:8}100%{opacity:0;r:20}}
.chl{fill:none;stroke:#DB6A41;stroke-width:2.2;stroke-dasharray:6 6;opacity:.75;animation:flow 1.2s linear infinite}
.chl.on{stroke-width:4;opacity:1}
#map.nochain .chl{display:none}
#map.dim .chl:not(.on){opacity:.15}
@keyframes flow{to{stroke-dashoffset:-24}}
.ppl{cursor:pointer}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
@media (prefers-reduced-motion:reduce){.chl,.bob,.pin.on .ring{animation:none}}
@media (max-width:820px){
 body{display:block;height:auto;overflow:auto}
 #stage{height:72vh;min-height:460px}
 aside{border-left:0;border-top:1px solid var(--line)}
 .brand{padding:8px 12px;gap:10px}.brand b{font-size:24px}.brand span{font-size:15px}
 .top{top:auto;bottom:12px;right:12px;left:12px;justify-content:flex-end}
 .top button{padding:0 11px}
 .tool{top:78px;left:10px}
 .seg.time{display:none}
 #card{top:auto;left:8px;right:8px;bottom:8px;width:auto;max-height:62%}
 .grid{grid-template-columns:minmax(0,1fr)}
 .grid .hdr{display:none}
 .grid .sem::before{content:attr(data-l);display:block;font-size:12px;font-weight:700;color:var(--mut);margin-bottom:6px}
}
@media (max-width:520px){.brand small{display:none}.top button .t{display:none}}
</style>
</head>
<body>
<main id="stage">
 <svg id="map" role="img" aria-label="海大電機學程群島地圖"></svg>
 <div class="brand glass"><b>EE<br>ISLAND.</b><div><span>海大電機</span><small>學程島 <em>COURSE MAP</em></small></div></div>
 <div class="top">
  <button id="bAll" title="回到全景"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17 17 7M9 7h8v8"/></svg><span class="t">全景</span></button>
  <button id="bPpl" title="切換學生小人"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg><span class="t">小人</span></button>
  <button id="bList" title="四年課表清單"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg><span class="t">清單</span></button>
  <button id="bHelp" title="系主任導覽" aria-label="系主任導覽">?</button>
 </div>
 <div class="tool">
  <div class="seg time glass" role="group" aria-label="時段">
   <button data-time="dawn" aria-label="清晨"><svg viewBox="0 0 24 24"><path d="M4 18h16M7 14a5 5 0 0 1 10 0M12 4v3M4.9 8.9l2 2M19.1 8.9l-2 2"/></svg></button>
   <button data-time="day" aria-pressed="true" aria-label="白天"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M5 19l1.5-1.5M17.5 6.5 19 5"/></svg></button>
   <button data-time="dusk" aria-label="黃昏"><svg viewBox="0 0 24 24"><path d="M3 18h18M6 18a6 6 0 0 1 12 0M12 7V4M8 9 6 7M16 9l2-2"/></svg></button>
   <button data-time="night" aria-label="夜晚"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg></button>
  </div>
  <div class="seg glass" role="group" aria-label="地圖工具">
   <button id="tLab" aria-pressed="true"><svg viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="8" rx="4"/></svg>名牌</button>
   <button id="tChain" aria-pressed="true"><svg viewBox="0 0 24 24"><circle cx="5" cy="18" r="2"/><circle cx="19" cy="6" r="2"/><path d="M7 17C11 15 13 9 17 7" stroke-dasharray="3 3"/></svg>銜接線</button>
   <button id="tPause" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M9 6v12M15 6v12"/></svg>暫停</button>
   <button id="tFit"><svg viewBox="0 0 24 24"><path d="M12 3 21 8 12 13 3 8z"/><path d="M3 13l9 5 9-5"/></svg>鳥瞰</button>
   <button id="tIn" aria-label="放大"><svg viewBox="0 0 24 24"><path d="M12 6v12M6 12h12"/></svg>放大</button>
   <button id="tOut" aria-label="縮小"><svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg>縮小</button>
  </div>
 </div>
 <section id="card" class="glass" aria-live="polite"></section>
 <div id="tip"></div>
 <div id="tour" role="dialog" aria-modal="false" aria-label="系主任導覽"><div class="box">
  <svg class="av" viewBox="-15 -46 30 50" aria-hidden="true"></svg>
  <div class="eb" id="tEb"></div>
  <h3 id="tT"></h3>
  <p id="tD"></p>
  <div class="bt"><button class="btn" id="tSkip">略過</button><div class="dots" id="tDots"></div><button class="btn k" id="tNext">下一步 →</button></div>
 </div></div>
 <div id="list" role="dialog" aria-label="四年課表"><div class="panel">
  <button class="x" id="lX" aria-label="關閉">✕</button>
  <div class="eb">FOUR-YEAR TIMELINE</div>
  <h2>四年必修與核心課程</h2>
  <div class="leg" id="leg"></div>
  <div class="grid" id="grid"></div>
  <p class="note" id="sixNote"></p>
 </div></div>
</main>
<aside>
 <div class="eb">THE CURRICULUM INDEX</div>
 <h1>把基礎，連起來。</h1>
 <p class="sub" id="sub"></p>
 <div class="who"><b>你是大幾的電機人？</b><p>選一個年級，看看那位小人這一年在修什麼。</p><div class="row" id="who"></div></div>
 <input class="search" id="q" type="search" placeholder="搜尋課程、領域、關鍵字…" aria-label="搜尋課程">
 <div class="tabs" role="tablist"><button role="tab" id="tabI" aria-selected="true">島嶼索引</button><button role="tab" id="tabC" aria-selected="false">銜接關係 <span id="nC"></span></button></div>
 <div id="idx"></div>
 <p class="foot">資料來源：國立臺灣海洋大學電機工程學系「大學部必修與核心課程關聯圖」（兩版）、「碩士班選修課程關聯圖」（三份）、「輔系必修科目表」。實際開課與修業規定以系上當年度公告為準。</p>
</aside>
<script>
{
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const YN=['','大一','大二','大三','大四'],SN=['','上','下'],SL=['','上學期','下學期'];
const pad=n=>String(n).padStart(2,'0');

/* ---------- 資料（依上傳文件） ---------- */
const SEM={
 '1-1':['計算機概論','計算機實習','普通物理','程式語言','普通物理實驗','微積分'],
 '1-2':['普通物理','普通物理實驗','微積分','工程數學','電路學','交換電路與邏輯設計'],
 '2-1':['工程數學','電磁學','線性代數','電路學','電子學','電工實驗'],
 '2-2':['電子學','電工實驗','電磁波','訊號與系統','機率學','資料結構','複變函數'],
 '3-1':['電子學','電工實驗','近代物理','自動控制','電機機械','通訊工程'],
 '3-2':['電子電路','電工實驗'],
 '4-1':['電工實驗'],'4-2':[]};
const SIX=['自動控制','通訊工程','半導體物理','資料結構','複變函數','電機機械'],ALT=['近代物理','電子電路'];
const TY={core:{n:'核心必修',c:'#DB6A41'},six:{n:'六選必選',c:'#3d7fc0'},alt:{n:'大三選必修（學期版）',c:'#4f9a5a'}};
const tyOf=n=>SIX.includes(n)?'six':ALT.includes(n)?'alt':'core';
const OCC={};
for(const k in SEM){const[y,s]=k.split('-').map(Number);SEM[k].forEach(n=>(OCC[n]=OCC[n]||[]).push([y,s]))}
OCC['半導體物理']=[];
const MINOR=[['程式設計','B5301M33'],['電磁波','B5302P49'],['電磁學','B5302P50'],['電路學','B5311P48'],['電子學','B5312P17'],['電子學','B5322P17'],['電路學','B5322P48'],['電子學','B5333P17']];
const MINOR_M=[['工程數學(Ⅰ)','B530108U'],['工程數學(Ⅱ)','B530208V']];
const NOTE={
 '電路學':'輔系科目表註記：電路學為一下、二上課程，須依序修習。',
 '電子學':'輔系科目表註記：電子學為二上、二下、三上課程，須依序修習。',

$('#tChain').onclick=e=>tog(e.currentTarget,on=>svg.classList.toggle('nochain',!on));
$('#tPause').onclick=e=>tog(e.currentTarget,on=>paused=on);
if(reduce)$('#tPause').setAttribute('aria-pressed','true');
$('#tFit').onclick=flyAll;$('#bAll').onclick=()=>{closeCard();flyAll()};
$('#tIn').onclick=()=>{const r=svg.getBoundingClientRect();zoomAt(.7,r.left+W/2,r.top+H/2)};
$('#tOut').onclick=()=>{const r=svg.getBoundingClientRect();zoomAt(1/.7,r.left+W/2,r.top+H/2)};
let pp=0;$('#bPpl').onclick=()=>{pp=pp%4+1;go('s:'+pp)};
$('#bHelp').onclick=startTour;
const TINT={dawn:'rgba(255,170,190,.16)',day:'transparent',dusk:'rgba(255,120,50,.2)',night:'rgba(20,30,90,.42)'};
document.querySelectorAll('[data-time]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-time]').forEach(x=>x.setAttribute('aria-pressed',x===b));$('#tint').setAttribute('fill',TINT[b.dataset.time])});

let toured=false;try{toured=localStorage.getItem('eeIslandToured')==='1'}catch(e){}
if(!toured)setTimeout(startTour,400);
}
</script>
</body>
